<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RichEngine</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
  * { box-sizing: border-box }
  :root {
    color-scheme: light dark;
    --sidebar: 264px;
    --bg: #fdfdfc;
    --side: #f6f6f4;
    --text: #191917;
    --muted: #83837d;
    --hover: #ebebe8;
    --bubble: #efefec;
    --composer: #fff;
    --border: #e7e7e3;
    --accent: #4f46e5;
    --shadow: 0 1px 2px #00000008, 0 12px 32px -8px #00000014;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191917;
      --side: #131312;
      --text: #ededeb;
      --muted: #8f8f8a;
      --hover: #262624;
      --bubble: #2a2a28;
      --composer: #212120;
      --border: #333330;
      --accent: #818cf8;
      --shadow: 0 1px 2px #0006, 0 12px 32px -8px #000a;
    }
  }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility }
  button, input, textarea, select { color: inherit; font: inherit }
  button { border: 0; background: none; cursor: pointer; transition: background .12s ease, color .12s ease, opacity .12s ease }
  button:disabled { cursor: default; opacity: .45 }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  svg { display: block }

  aside { position: fixed; inset: 0 auto 0 0; z-index: 20; overflow-y: auto; width: var(--sidebar); padding: 14px 10px; background: var(--side); border-right: 1px solid var(--border) }
  .brand { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 10px; font-size: 15px; font-weight: 650; letter-spacing: -.02em }
  .brand img { width: 18px; height: 18px }
  #new-chat { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-weight: 500; text-align: left }
  #new-chat:hover { background: var(--hover) }
  #new-chat svg { width: 17px; height: 17px }
  .recent-label { margin: 26px 10px 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase }
  #recents { display: grid; gap: 1px }
  .recent { display: flex; align-items: center; border-radius: 8px }
  .recent:hover { background: var(--hover) }
  .recent.active { background: var(--hover) }
  .recent.active .recent-title { font-weight: 550 }
  .recent-title { overflow: hidden; flex: 1; min-width: 0; padding: 8px 4px 8px 10px; font-size: 14px; text-align: left; text-overflow: ellipsis; white-space: nowrap }
  .recent-edit { flex: 1; min-width: 0; margin: 0 4px 0 10px; padding: 5px 0; border: 0; border-bottom: 1px solid var(--accent); outline: 0; background: transparent; font-size: 14px }
  .recent-act { display: none; width: 24px; height: 24px; flex: none; place-items: center; margin-right: 2px; border-radius: 6px; color: var(--muted); font-size: 13px }
  .recent:hover .recent-act, .recent:focus-within .recent-act { display: grid }
  .recent-act:hover { color: var(--text); background: var(--bg) }

  .credentials { display: block; margin: 22px 10px; color: var(--muted); font-size: 12px }
  #api-key { width: 100%; margin-top: 6px; padding: 7px 9px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px }
  #api-key:focus { border-color: var(--accent); outline: 0 }

  main { min-height: 100vh; margin-left: var(--sidebar) }
  #chat { width: min(720px, 100%); margin: auto; padding: 48px 24px 160px }
  #empty { position: fixed; top: calc(50% - 60px); left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); transform: translateX(-50%); font-size: 24px; font-weight: 600; letter-spacing: -.03em }
  .message { margin: 32px 0; white-space: pre-wrap; overflow-wrap: anywhere }
  .user { width: fit-content; max-width: 78%; margin-left: auto; padding: 9px 15px; border-radius: 18px 18px 4px 18px; background: var(--bubble) }
  .user-images { display: flex; flex-wrap: wrap; gap: 8px }
  .user-text + .user-images { margin-top: 9px }
  .user-images img { display: block; width: min(240px, 100%); max-height: 240px; border-radius: 10px; object-fit: cover }
  .assistant { padding: 0 2px }
  .waiting { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  details { margin-bottom: 14px; color: var(--muted); font-size: 13.5px }
  summary { width: fit-content; cursor: pointer; user-select: none; font-weight: 500 }
  .reasoning { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border) }
  .stats { margin-top: 14px; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1 }
  .error { color: #dc2626 }
  .actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity .12s ease }
  .message:hover .actions, .actions:focus-within { opacity: 1 }
  .actions[hidden] { display: none }
  .act { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 7px; color: var(--muted) }
  .act:hover { color: var(--text); background: var(--hover) }
  .codeblock { margin: 0 0 12px; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--bubble) }
  .codeblock > pre { margin: 0; border: 0; border-radius: 0; background: none }
  .code-head { display: flex; align-items: center; justify-content: space-between; min-height: 30px; padding: 3px 6px 3px 14px; color: var(--muted); font-size: 11.5px; border-bottom: 1px solid var(--border) }
  .copy { padding: 3px 8px; border-radius: 6px; color: var(--muted); font-size: 11.5px }
  .copy:hover { color: var(--text); background: var(--hover) }
  #to-bottom { position: fixed; left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); bottom: 96px; z-index: 9; transform: translateX(-50%); padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--composer); box-shadow: var(--shadow); color: var(--muted); font-size: 12.5px }
  #to-bottom:hover { color: var(--text) }
  #to-bottom[hidden] { display: none }

  form { position: fixed; left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 10; display: flex; flex-direction: column; gap: 2px; width: min(720px, calc(100vw - var(--sidebar) - 32px)); transform: translateX(-50%); padding: 10px 10px 8px; border: 1px solid var(--border); border-radius: 24px; background: var(--composer); box-shadow: var(--shadow); transition: border-color .15s ease, box-shadow .15s ease }
  form:focus-within { border-color: color-mix(in srgb, var(--text) 30%, var(--border)); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent) }
  body.empty form { top: 50%; bottom: auto }
  .composer { min-width: 0 }
  #attachments { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px }
  #attachments:empty { display: none }
  .attachment { position: relative; width: 58px; height: 58px; flex: none }
  .attachment img, .attachment-status { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 10px; object-fit: cover }
  .attachment-status { display: grid; place-items: center; padding: 4px; background: var(--bubble); text-align: center; font-size: 11px; line-height: 1.2 }
  .remove-image { position: absolute; top: -5px; right: -5px; display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; color: #fff; background: #333; font-size: 15px; line-height: 1 }
  textarea { display: block; width: 100%; max-height: 180px; padding: 4px 8px; resize: none; border: 0; outline: 0; background: transparent; field-sizing: content }
  textarea::placeholder { color: var(--muted) }
  .toolbar { display: flex; align-items: center; gap: 4px }
  .toolbar .spacer { flex: 1 }
  #attach[hidden] { display: none }
  #attach { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: var(--muted) }
  #attach:hover { color: var(--text); background: var(--hover) }
  .effort[hidden] { display: none }
  .effort { position: relative; display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 24px 0 12px; border-radius: 999px; color: var(--muted); font-size: 13px; line-height: 1 }
  .effort:hover, .effort:focus-within { color: var(--text); background: var(--hover) }
  .effort::after { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); content: '\2304'; font-size: 11px; pointer-events: none }
  .effort > span { flex: none }
  select { display: block; min-width: 0; max-width: 140px; overflow: hidden; padding: 0; border: 0; outline: 0; background: transparent; text-overflow: ellipsis; white-space: nowrap; cursor: pointer }
  #send { display: grid; width: 34px; height: 34px; flex: none; place-items: center; border-radius: 50%; color: var(--composer); background: var(--text); font-size: 15px; transition: transform .12s ease }
  #send:not(:disabled):hover { transform: scale(1.06) }
  #send:disabled { color: var(--muted); background: var(--hover) }

  .md-done > :first-child, .md-tail > :first-child { margin-top: 0 }
  .md-done > :last-child, .md-tail > :last-child { margin-bottom: 0 }
  .message.live .code-head .copy { visibility: hidden }
  .visually-hidden { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap }
  .content p { margin: 0 0 12px }
  .content h3, .content h4, .content h5, .content h6 { margin: 18px 0 8px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3 }
  .content h3 { font-size: 19px }
  .content h4 { font-size: 16px }
  .content h5, .content h6 { font-size: 14px }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 22px }
  .content li { margin: 3px 0 }
  .content blockquote { margin: 0 0 12px; padding-left: 12px; color: var(--muted); border-left: 2px solid var(--border) }
  .content a { color: var(--accent); text-decoration: none }
  .content a:hover { text-decoration: underline }
  .content code { padding: 2px 5px; border-radius: 6px; background: var(--bubble); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .content pre { margin: 0 0 12px; overflow-x: auto; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bubble) }
  .content pre code { padding: 0; border-radius: 0; background: none; white-space: pre }
  #mobile-header, #scrim { display: none }

  @media (max-width: 720px) {
    :root { --sidebar: 0px }
    aside { width: 260px; transform: translateX(-100%); transition: transform .18s ease }
    body.menu-open aside { transform: none }
    #scrim { position: fixed; inset: 0; z-index: 15; background: #0005 }
    body.menu-open #scrim { display: block }
    #mobile-header { position: fixed; inset: 0 0 auto; z-index: 12; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px) }
    #menu, #mobile-new { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px }
    #menu:hover, #mobile-new:hover { background: var(--hover) }
    #mobile-header .brand { padding: 0; font-size: 16px }
    #chat { padding: 66px 16px 140px }
    #empty { top: calc(50% - 58px); left: 50%; font-size: 23px }
    form { left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); width: calc(100% - 16px) }
    textarea { max-height: 140px }
  }
  @media (max-width: 430px) {
    .effort { padding-left: 5px }
    .effort > span { display: none }
    .user { max-width: 88% }
  }
  @media (min-width: 1400px) {
    #chat { width: min(860px, 100%) }
    form { width: min(860px, calc(100vw - var(--sidebar) - 48px)) }
  }
</style>

<aside id="sidebar">
  <div class="brand">
    <img src="/favicon.ico" alt="">
    RichEngine
  </div>
  <button id="new-chat" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="m15 4 5 5M14 10l6-6"/></svg>
    New chat
  </button>
  <div class="recent-label">Recents</div>
  <nav id="recents" aria-label="Recent chats"></nav>
  <label class="credentials">API key (if required)
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" aria-label="API key">
  </label>
</aside>
<div id="scrim"></div>
<header id="mobile-header">
  <button id="menu" type="button" aria-label="Open sidebar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">RichEngine</div>
  <button id="mobile-new" type="button" aria-label="New chat"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="m15 4 5 5M14 10l6-6"/></svg></button>
</header>
<main><div id="chat" role="log" aria-live="off" aria-relevant="additions" aria-label="Conversation"></div></main>
<div id="sr-status" class="visually-hidden" role="status"></div>
<button id="to-bottom" type="button" hidden>&darr; Latest</button>
<form id="form">
  <input id="image-input" type="file" accept="image/*" multiple hidden>
  <div class="composer">
    <div id="attachments" aria-label="Attached images"></div>
    <textarea id="input" rows="1" placeholder="Message RichEngine" title="Enter to send · Shift+Enter for a new line" autofocus></textarea>
  </div>
  <div class="toolbar">
    <button id="attach" type="button" aria-label="Add images" title="Add images">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <label class="effort picker"><span>Model</span>
      <select id="model" aria-label="Model">
        <option value="">Default</option>
      </select>
    </label>
    <label class="effort"><span>Thinking</span>
      <select id="effort" aria-label="Thinking effort">
        <option value="">Default</option>
        <option value="xhigh">XHigh</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="none">Off</option>
      </select>
    </label>
    <div class="spacer"></div>
    <button id="send" aria-label="Send">&#8593;</button>
  </div>
</form>

<script>
  const $ = selector => document.querySelector(selector);
  const chat = $('#chat');
  const form = $('#form');
  const input = $('#input');
  const attachmentsBox = $('#attachments');
  const imageInput = $('#image-input');
  const attach = $('#attach');
  const effort = $('#effort');
  const model = $('#model');
  const modelKey = 'richengine-chat-model';
  const apiKey = $('#api-key');
  const send = $('#send');
  const recents = $('#recents');
  const toBottom = $('#to-bottom');
  const storeKey = 'richengine-chats';
  const effortKey = 'richengine-thinking-effort';
  const allowedEfforts = new Set([...effort.options].map(option => option.value));
  let conversations = load();
  let activeId = null;
  let messages = [];
  let attachments = [];
  let controller;
  // Until /v1/models says otherwise; a text-only model takes no images.
  let imagesAccepted = true;
  let modelData = [];
  let contextLen = 0;
  // Auto-scroll only follows when the reader is already at the bottom.
  let pinned = true;

  const savedEffort = storageGet(effortKey);
  effort.value = allowedEfforts.has(savedEffort) ? savedEffort : '';

  function authorization() {
    return apiKey.value ? {Authorization: `Bearer ${apiKey.value}`} : {};
  }

  async function loadModalities() {
    try {
      const response = await fetch('/v1/models', {headers: authorization()});
      if (!response.ok) return;
      const models = (await response.json()).data;
      if (!Array.isArray(models)) return;
      const saved = storageGet(modelKey);
      model.replaceChildren(new Option('Default', ''));
      models.forEach(item => { if (item?.id) model.add(new Option(item.id, item.id)); });
      model.value = models.some(item => item?.id === saved) ? saved : '';
      model.parentElement.hidden = !models.length;
      modelData = models;
      applyModel();
    } catch { /* The server still rejects input the model cannot take. */ }
  }

  // Capabilities and limits follow the selected model, falling back to the
  // server default (the first entry) when the picker is on "Default".
  function applyModel() {
    const info = modelData.find(item => item?.id === model.value) || modelData[0];
    contextLen = Number(info?.context_length) || 0;
    const modalities = info?.input_modalities;
    if (!Array.isArray(modalities)) return;
    imagesAccepted = modalities.includes('image');
    attach.hidden = !imagesAccepted;
    if (!imagesAccepted) clearAttachments();
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    }
    catch { return null; }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    }
    catch { /* Chat still works if browser storage is full or disabled. */ return false; }
  }

  function cleanUserContent(content) {
    if (typeof content === 'string') return content;
    if (!Array.isArray(content)) return null;
    const clean = content.flatMap(part => {
      if (part?.type === 'text' && typeof part.text === 'string') return [{type: 'text', text: part.text}];
      const url = part?.type === 'image_url' ? part.image_url?.url : null;
      return typeof url === 'string' && url.startsWith('data:image/') ? [{type: 'image_url', image_url: {url}}] : [];
    });
    return clean.length ? clean : null;
  }

  function cleanMessage(message) {
    if (!message || !['user', 'assistant'].includes(message.role)) return null;
    const content = message.role === 'user' ? cleanUserContent(message.content) : message.content;
    if (content === null || (message.role === 'assistant' && typeof content !== 'string')) return null;
    const clean = {role: message.role, content};
    if (message.role === 'assistant' && typeof message.reasoning_content === 'string') clean.reasoning_content = message.reasoning_content;
    if (message.role === 'assistant' && Number.isFinite(message.tps) && message.tps > 0) clean.tps = message.tps;
    if (message.role === 'assistant' && typeof message.stats === 'string') clean.stats = message.stats;
    return clean;
  }

  function load() {
    try {
      const stored = JSON.parse(storageGet(storeKey));
      if (!Array.isArray(stored)) return [];
      const seen = new Set();
      return stored.flatMap(conversation => {
        if (!conversation || typeof conversation.id !== 'string' || seen.has(conversation.id) ||
            typeof conversation.title !== 'string' || !Number.isFinite(conversation.updated) ||
            !Array.isArray(conversation.messages)) return [];
        const messages = conversation.messages.map(cleanMessage).filter(Boolean);
        if (!messages.length) return [];
        seen.add(conversation.id);
        return [{id: conversation.id, title: conversation.title, updated: conversation.updated, messages}];
      });
    } catch { return []; }
  }

  function hasImages(conversation) {
    return conversation.messages.some(message => Array.isArray(message.content) &&
      message.content.some(part => part.type === 'image_url'));
  }

  function withoutImages(conversation) {
    const messages = conversation.messages.map(message => Array.isArray(message.content) ? {
      ...message,
      content: message.content.map(part => part.type === 'image_url' ? {type: 'text', text: '[Image not saved]'} : part)
    } : message);
    return {...conversation, messages};
  }

  // The storage write serializes every chat, images included; it runs on an
  // idle slice so a completed turn never blocks the next keystroke, and is
  // flushed synchronously when the page goes away.
  let saveScheduled = false;
  const idleRun = window.requestIdleCallback || (fn => setTimeout(fn, 300));

  function persistChats() {
    // Browser storage holds a few MB per site, which one photo can fill. Rather
    // than fail every later save, store the newest chats that fit, each with its
    // images if they still fit and without them otherwise, so a photo too large
    // to store does not cost older chats theirs. The open page keeps its images.
    if (!storageSet(storeKey, JSON.stringify(conversations))) {
      const stored = [];
      for (const conversation of conversations) {
        const candidates = hasImages(conversation) ? [conversation, withoutImages(conversation)] : [conversation];
        const fitting = candidates.find(candidate => storageSet(storeKey, JSON.stringify([...stored, candidate])));
        if (!fitting) break;
        stored.push(fitting);
      }
    }
  }

  function save() {
    conversations.sort((a, b) => b.updated - a.updated);
    conversations = conversations.slice(0, 20);
    renderRecents();
    if (saveScheduled) return;
    saveScheduled = true;
    idleRun(() => { saveScheduled = false; persistChats(); }, {timeout: 2000});
  }

  addEventListener('pagehide', () => {
    if (saveScheduled) { saveScheduled = false; persistChats(); }
  });

  function titleFor(text) {
    const title = text.replace(/\s+/g, ' ').trim();
    return title.length > 34 ? `${title.slice(0, 34)}…` : title;
  }

  // crypto.randomUUID exists only in secure contexts, which excludes a LAN
  // address over plain HTTP; getRandomValues works everywhere.
  function chatId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)),
      byte => byte.toString(16).padStart(2, '0')).join('');
  }

  function userParts(content) {
    if (typeof content === 'string') return {text: content, images: []};
    return {
      text: content.filter(part => part.type === 'text').map(part => part.text).join('\n'),
      images: content.filter(part => part.type === 'image_url').map(part => part.image_url.url)
    };
  }

  function requestMessages() {
    return messages.map(({tps, ...message}) => message);
  }

  function displayContent(content) {
    // Remove surrounding blank lines without stripping the first line's indentation.
    return content.replace(/^(?:[ \t]*\r?\n)+|(?:\r?\n[ \t]*)+$/g, '');
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Inline runs after escaping, so only tags this emits can appear.
  function inlineMd(text) {
    return escapeHtml(text)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  // Minimal markdown: fenced code, headings, lists, quotes, paragraphs.
  // An unclosed fence mid-stream renders as an open code block, which is
  // what the reader sees anyway.
  function renderMarkdown(text) {
    const out = [];
    let para = [], list = null, code = null;
    const flushPara = () => {
      if (para.length) out.push(`<p>${para.map(inlineMd).join('<br>')}</p>`);
      para = [];
    };
    const flushList = () => {
      if (list) out.push(`<${list.type}>${list.items.map(item => `<li>${inlineMd(item)}</li>`).join('')}</${list.type}>`);
      list = null;
    };
    const flushAll = () => { flushPara(); flushList(); };
    for (const line of text.split('\n')) {
      if (code !== null) {
        if (/^```\s*$/.test(line)) {
          out.push(codeBlock(code));
          code = null;
        } else code.lines.push(line);
        continue;
      }
      const fence = /^```(\w*)\s*$/.exec(line);
      const heading = /^(#{1,4})\s+(.*)/.exec(line);
      const bullet = /^\s*[-*•]\s+(.*)/.exec(line);
      const numbered = /^\s*\d+[.)]\s+(.*)/.exec(line);
      const quote = /^>\s?(.*)/.exec(line);
      if (fence) { flushAll(); code = {lang: fence[1] || '', lines: []}; }
      else if (heading) {
        flushAll();
        out.push(`<h${Math.min(heading[1].length + 2, 6)}>${inlineMd(heading[2])}</h${Math.min(heading[1].length + 2, 6)}>`);
      }
      else if (bullet || numbered) {
        flushPara();
        const type = bullet ? 'ul' : 'ol';
        if (!list || list.type !== type) { flushList(); list = {type, items: []}; }
        list.items.push((bullet || numbered)[1]);
      }
      else if (quote) { flushAll(); out.push(`<blockquote>${inlineMd(quote[1])}</blockquote>`); }
      else if (!line.trim()) flushAll();
      else para.push(line);
    }
    flushAll();
    if (code !== null) out.push(codeBlock(code));
    return out.join('');
  }

  // The fence language (or "text") labels the header; copy reads the code back.
  function codeBlock(code) {
    const lang = escapeHtml(code.lang || 'text');
    return `<div class="codeblock"><div class="code-head"><span>${lang}</span>` +
      `<button class="copy" type="button">Copy</button></div>` +
      `<pre><code>${escapeHtml(code.lines.join('\n'))}</code></pre></div>`;
  }

  // The position after the last blank line outside a code fence: everything
  // before it renders to finished blocks, everything after it may still grow.
  function mdStableEnd(text) {
    let end = 0, fence = false, offset = 0;
    for (const line of text.split('\n')) {
      if (/^```/.test(line)) fence = !fence;
      // A blank line ends a block only where a newline follows it; the last
      // line of the text has none and may still grow.
      else if (!fence && !line.trim() && offset + line.length < text.length)
        end = offset + line.length + 1;
      offset += line.length + 1;
    }
    return end;
  }

  // Paint only the part of the markdown that can still change: finished
  // blocks append once to .md-done, the open tail repaints in .md-tail, so a
  // streamed reply does not rebuild (and de-focus) its earlier DOM per frame.
  function paintContent(box, text) {
    const state = box._md || (box._md = {done: 0, doneText: ''});
    const content = box.querySelector('.content');
    if (!content.firstElementChild) {
      content.innerHTML = '<div class="md-done"></div><div class="md-tail"></div>';
    }
    const [doneEl, tailEl] = content.children;
    text = displayContent(text);
    if (!text.startsWith(state.doneText)) {
      state.done = 0;
      state.doneText = '';
      doneEl.innerHTML = '';
    }
    const end = mdStableEnd(text);
    if (end > state.done) {
      doneEl.insertAdjacentHTML('beforeend', renderMarkdown(text.slice(state.done, end)));
      state.done = end;
      state.doneText = text.slice(0, end);
    }
    tailEl.innerHTML = renderMarkdown(text.slice(state.done));
  }

  function nearBottom() {
    return scrollY + innerHeight >= document.documentElement.scrollHeight - 80;
  }

  function maybeScroll() {
    if (pinned) scrollTo(0, document.body.scrollHeight);
  }

  function pinAndScroll() {
    pinned = true;
    toBottom.hidden = true;
    scrollTo(0, document.body.scrollHeight);
  }

  // Live stats during the stream, real usage and context share once the
  // final usage chunk arrives. The last rendered line is kept on the message
  // so a reloaded chat shows the same numbers.
  function statsText(assistant) {
    const parts = [];
    if (assistant.tps) parts.push(`${Number(assistant.tps).toLocaleString(undefined, {maximumFractionDigits: 1})} tok/s`);
    const usage = assistant.usage;
    if (usage) {
      const total = usage.prompt_tokens + usage.completion_tokens;
      parts.push(`${total.toLocaleString()} tok` + (contextLen ? ` · ${Math.min(100, Math.round(total / contextLen * 100))}% ctx` : ''));
      const cached = usage.prompt_tokens_details?.cached_tokens;
      if (cached) parts.push(`${cached.toLocaleString()} cached`);
    }
    if (assistant.stopped) parts.push('stopped');
    if (assistant.interrupted) parts.push('interrupted');
    return parts.join(' · ');
  }

  function paintStats(box, assistant) {
    const stats = box.querySelector('.stats');
    const text = statsText(assistant);
    stats.textContent = text;
    stats.hidden = !text;
  }

  // Re-rendering the whole reply every token is wasteful; coalesce paint and
  // the follow-scroll to one layout per frame.
  function schedulePaint(box, text) {
    if (box.paintQueued) return;
    box.paintQueued = true;
    requestAnimationFrame(() => {
      box.paintQueued = false;
      if (!box.isConnected) return;
      paintContent(box, text);
      maybeScroll();
    });
  }

  function assistantBox(message, live = false) {
    const box = document.createElement('div');
    box.className = `message assistant${live ? ' live' : ''}`;
    const details = document.createElement('details');
    details.open = live;
    details.hidden = !message.reasoning_content;
    details.innerHTML = `<summary><span class="think-label">${live ? 'Thinking…' : 'Thought'}</span></summary><div class="reasoning"></div>`;
    details.querySelector('.reasoning').textContent = displayContent(message.reasoning_content || '');
    const content = document.createElement('div');
    content.className = 'content';
    const waiting = document.createElement('div');
    waiting.className = 'waiting';
    waiting.hidden = !live || Boolean(message.content || message.reasoning_content);
    waiting.setAttribute('aria-label', 'Generating response');
    const stats = document.createElement('div');
    stats.className = 'stats';
    const savedStats = message.stats || (message.tps ? `${Number(message.tps).toLocaleString(undefined, {maximumFractionDigits: 1})} tok/s` : '');
    stats.textContent = savedStats;
    stats.hidden = !savedStats;
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.hidden = live;
    actions.innerHTML = '<button class="act regenerate" type="button" title="Regenerate" aria-label="Regenerate response">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>';
    box.append(details, content, waiting, stats, actions);
    paintContent(box, message.content || '');
    return box;
  }

  function addMessage(message, live = false) {
    const box = message.role === 'assistant' ? assistantBox(message, live) : document.createElement('div');
    if (message.role !== 'assistant') {
      box.className = `message ${message.role}`;
      const {text, images} = userParts(message.content);
      if (text) {
        const content = document.createElement('div');
        content.className = 'user-text';
        content.textContent = text;
        box.append(content);
      }
      if (images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'user-images';
        images.forEach(url => {
          const image = document.createElement('img');
          image.src = url;
          image.alt = 'Attached image';
          gallery.append(image);
        });
        box.append(gallery);
      }
    }
    box._message = message;
    chat.append(box);
    maybeScroll();
    return box;
  }

  function renderChat() {
    chat.replaceChildren();
    document.body.classList.toggle('empty', !messages.length);
    if (!messages.length) {
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = 'How can I help?';
      chat.append(empty);
    } else messages.forEach(message => addMessage(message));
  }

  function renderRecents() {
    recents.replaceChildren();
    conversations.forEach(conversation => {
      const item = document.createElement('div');
      item.className = `recent${conversation.id === activeId ? ' active' : ''}`;
      const title = document.createElement('button');
      title.type = 'button';
      title.className = 'recent-title';
      title.textContent = conversation.title;
      title.title = conversation.title;
      title.disabled = Boolean(controller);
      title.addEventListener('click', () => openChat(conversation.id));
      const rename = document.createElement('button');
      rename.type = 'button';
      rename.className = 'recent-act';
      rename.textContent = '✎';
      rename.setAttribute('aria-label', `Rename ${conversation.title}`);
      rename.title = 'Rename';
      rename.disabled = Boolean(controller);
      rename.addEventListener('click', () => renameChat(conversation, item));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'recent-act';
      del.textContent = '×';
      del.setAttribute('aria-label', `Delete ${conversation.title}`);
      del.title = 'Delete';
      del.disabled = Boolean(controller);
      del.addEventListener('click', () => deleteChat(conversation.id));
      item.append(title, rename, del);
      recents.append(item);
    });
  }

  function renameChat(conversation, item) {
    const edit = document.createElement('input');
    edit.className = 'recent-edit';
    edit.value = conversation.title;
    edit.setAttribute('aria-label', 'Chat title');
    item.replaceChildren(edit);
    edit.focus();
    edit.select();
    const commit = () => {
      const title = edit.value.replace(/\s+/g, ' ').trim();
      if (title && title !== conversation.title) {
        conversation.title = title.length > 60 ? `${title.slice(0, 60)}…` : title;
        save();
      } else renderRecents();
    };
    edit.addEventListener('blur', commit);
    edit.addEventListener('keydown', event => {
      if (event.key === 'Enter') edit.blur();
      else if (event.key === 'Escape') { edit.removeEventListener('blur', commit); renderRecents(); }
    });
  }

  function deleteChat(id) {
    conversations = conversations.filter(conversation => conversation.id !== id);
    save();
    if (activeId === id) newChat();
  }

  function newChat() {
    if (controller) return;
    activeId = null;
    messages = [];
    clearAttachments();
    document.body.classList.remove('menu-open');
    renderChat();
    renderRecents();
    pinAndScroll();
    input.focus();
  }

  function openChat(id) {
    if (controller) return;
    const conversation = conversations.find(item => item.id === id);
    if (!conversation) return;
    activeId = id;
    messages = conversation.messages;
    clearAttachments();
    document.body.classList.remove('menu-open');
    renderChat();
    renderRecents();
    pinAndScroll();
    input.focus();
  }

  function persist(firstPrompt) {
    let conversation = conversations.find(item => item.id === activeId);
    if (!conversation) {
      conversation = {id: chatId(), title: titleFor(firstPrompt), messages, updated: Date.now()};
      conversations.push(conversation);
      activeId = conversation.id;
    }
    if (!conversation.title) conversation.title = titleFor(firstPrompt);
    conversation.messages = messages;
    conversation.updated = Date.now();
    save();
  }

  // field-sizing grows the textarea in CSS; the manual measure is the fallback.
  const canFieldSize = typeof CSS !== 'undefined' && CSS.supports('field-sizing', 'content');
  function resize() {
    if (canFieldSize) return;
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight}px`;
  }

  function renderAttachments() {
    attachmentsBox.replaceChildren();
    attachments.forEach(attachment => {
      const item = document.createElement('div');
      item.className = 'attachment';
      const name = attachment.name || 'Attached image';
      item.title = name;
      const preview = document.createElement(attachment.url ? 'img' : 'span');
      if (attachment.url) {
        preview.src = attachment.url;
        preview.alt = name;
      } else {
        preview.className = `attachment-status${attachment.error ? ' error' : ''}`;
        preview.textContent = attachment.error ? 'Read failed' : 'Loading…';
        preview.setAttribute('role', 'status');
      }
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove-image';
      remove.setAttribute('aria-label', `Remove ${name}`);
      remove.textContent = '\u00d7';
      remove.addEventListener('click', () => {
        attachments = attachments.filter(value => value !== attachment);
        renderAttachments();
      });
      item.append(preview, remove);
      attachmentsBox.append(item);
    });
    updateComposer();
  }

  function clearAttachments() {
    attachments = [];
    imageInput.value = '';
    renderAttachments();
  }

  function readImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  async function addImages(files) {
    const images = Array.from(files).filter(file => file.type.startsWith('image/'));
    if (!images.length) return;
    // Readers update stable entries, even if rollback moves them to a new draft.
    const selected = images.map(file => ({name: file.name, url: null, error: false}));
    attachments.push(...selected);
    renderAttachments();
    await Promise.all(images.map(async (file, index) => {
      const attachment = selected[index];
      try {
        attachment.url = await readImage(file);
      } catch {
        attachment.error = true;
      }
      if (attachments.includes(attachment)) renderAttachments();
    }));
  }

  function canSend() {
    return Boolean(input.value.trim() || attachments.length) &&
      attachments.every(attachment => attachment.url);
  }

  function updateComposer() {
    send.disabled = !controller && !canSend();
  }

  function setRunning(running) {
    send.textContent = running ? '\u25a0' : '\u2191';
    send.setAttribute('aria-label', running ? 'Stop' : 'Send');
    effort.disabled = running;
    model.disabled = running;
    attach.disabled = running;
    $('#new-chat').disabled = running;
    $('#mobile-new').disabled = running;
    renderRecents();
    updateComposer();
  }

  function consume(event, assistant, box, state) {
    const data = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('\n');
    if (!data || data === '[DONE]') return data === '[DONE]';
    const chunk = JSON.parse(data);
    if (chunk.error) throw new Error(chunk.error.message);
    const stats = box.querySelector('.stats');
    const progress = chunk.prompt_progress;
    if (progress && Number.isFinite(progress.processed) && Number.isFinite(progress.total)) {
      const cached = progress.cache ? ` (${progress.cache.toLocaleString()} cached)` : '';
      stats.textContent = `Prefill ${progress.processed.toLocaleString()}/${progress.total.toLocaleString()} tok${cached}`;
      stats.hidden = false;
    }
    const speed = Number(chunk.metrics?.request_latency?.stream_tokens_per_second);
    if (Number.isFinite(speed) && speed > 0) assistant.tps = speed;
    if (chunk.usage) assistant.usage = chunk.usage;
    if (assistant.tps || assistant.usage) paintStats(box, assistant);
    const delta = chunk.choices?.[0]?.delta;
    // A chunk without text has nothing to show or scroll to.
    if (!delta?.reasoning_content && !delta?.content) return false;
    box.querySelector('.waiting').hidden = true;
    if (delta.reasoning_content) {
      assistant.reasoning_content += delta.reasoning_content;
      const details = box.querySelector('details');
      details.hidden = false;
      details.querySelector('.reasoning').textContent = displayContent(assistant.reasoning_content);
    }
    if (delta.content) {
      if (!state.firstDeltaAt) state.firstDeltaAt = performance.now();
      assistant.content += delta.content;
      schedulePaint(box, assistant.content);
      // Before the server reports real throughput, estimate from streamed
      // text (~4 chars per token) so the reader sees progress right away.
      if (!assistant.tps) {
        const elapsed = (performance.now() - state.firstDeltaAt) / 1000;
        if (elapsed > 0.5) {
          stats.textContent = `~${Math.round(assistant.content.length / 4 / elapsed).toLocaleString()} tok/s`;
          stats.hidden = false;
        }
      }
    }
    maybeScroll();
    return false;
  }

  async function complete() {
    if (controller || !canSend()) return;
    const text = input.value.trim();
    const pendingAttachments = attachments;
    const content = pendingAttachments.length ? [
      ...(text ? [{type: 'text', text}] : []),
      ...pendingAttachments.map(attachment => ({type: 'image_url', image_url: {url: attachment.url}}))
    ] : text;
    input.value = '';
    attachments = [];
    renderAttachments();
    resize();
    document.body.classList.remove('empty');
    $('#empty')?.remove();
    pinned = true;
    messages.push({role: 'user', content});
    const userBox = addMessage(messages.at(-1));
    try {
      await streamReply(text || pendingAttachments[0]?.name || 'Image');
    } catch (error) {
      // A stopped stream keeps its partial output; other errors roll back.
      if (error.name === 'AbortError') return;
      messages.pop();
      userBox.remove();
      if (!messages.length) renderChat();
      if (input.value === '') input.value = text;
      // Restore the submitted entries alongside the next draft's pending reads.
      attachments.unshift(...pendingAttachments);
      renderAttachments();
      resize();
      const note = addMessage({role: 'assistant', content: error.message});
      note.classList.add('error');
    }
  }

  // Streams the assistant reply for the user message already at the tail.
  // Regenerate truncates back to a user turn and calls this directly.
  async function streamReply(firstPrompt) {
    const assistant = {role: 'assistant', content: '', reasoning_content: ''};
    const box = addMessage(assistant, true);
    const state = {firstDeltaAt: 0};
    controller = new AbortController();
    setRunning(true);
    try {
      const response = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...authorization()},
        body: JSON.stringify({messages: requestMessages(), stream: true, stream_options: {include_usage: true}, ...(model.value ? {model: model.value} : {}), ...(effort.value ? {reasoning_effort: effort.value} : {})}),
        signal: controller.signal
      });
      if (!response.ok) throw new Error((await response.json()).error?.message || response.statusText);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let doneEvent = false;
      while (true) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop();
        events.forEach(event => { doneEvent ||= consume(event, assistant, box, state); });
        if (done) break;
      }
      if (buffer) doneEvent ||= consume(buffer, assistant, box, state);
      if (!doneEvent) throw new Error('Connection closed early');
      box.querySelector('.waiting').hidden = true;
      paintContent(box, assistant.content);
      assistant.stats = statsText(assistant);
      $('#sr-status').textContent = `Response complete${assistant.stats ? ` · ${assistant.stats}` : ''}`;
      messages.push(assistant);
      persist(firstPrompt);
    } catch (error) {
      // Interrupted streams keep whatever arrived: a deliberate stop is marked
      // "stopped", a dropped connection "interrupted". Nothing arrived yet is
      // still an error the caller reports.
      const partial = Boolean(assistant.content || assistant.reasoning_content);
      if (error.name !== 'AbortError' && !partial) {
        box.remove();
        throw error;
      }
      box.querySelector('.waiting').hidden = true;
      paintContent(box, assistant.content);
      if (error.name === 'AbortError') assistant.stopped = true;
      else assistant.interrupted = true;
      const label = assistant.stopped ? 'stopped' : 'interrupted';
      assistant.stats = statsText(assistant) || label;
      paintStats(box, assistant);
      $('#sr-status').textContent = `Response ${label}`;
      messages.push(assistant);
      persist(firstPrompt);
    } finally {
      box.querySelector('details')?.removeAttribute('open');
      const label = box.querySelector('.think-label');
      if (label) label.textContent = 'Thought';
      box.classList.remove('live');
      box.querySelector('.actions').hidden = false;
      controller = undefined;
      setRunning(false);
      input.focus();
    }
  }

  // Regenerate: drop the turn from this assistant message on and resend.
  function regenerate(box) {
    if (controller) return;
    // The box carries its message entry; error notes hold none and miss here.
    const index = messages.indexOf(box._message);
    if (index < 0 || messages[index]?.role !== 'assistant') return;
    const prompt = messages.slice(0, index).reverse().find(message => message.role === 'user');
    const {text} = userParts(prompt?.content ?? '');
    messages = messages.slice(0, index);
    renderChat();
    pinned = true;
    streamReply(text || 'Image').catch(error => {
      if (error.name === 'AbortError') return;
      const note = addMessage({role: 'assistant', content: error.message});
      note.classList.add('error');
    });
  }

  form.addEventListener('submit', event => { event.preventDefault(); controller ? controller.abort() : complete(); });
  effort.addEventListener('change', () => {
    storageSet(effortKey, effort.value);
  });
  model.addEventListener('change', () => {
    storageSet(modelKey, model.value);
    applyModel();
  });
  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      newChat();
    }
    if (event.key === 'Escape' && controller) controller.abort();
  });
  // Code copy and regenerate are delegated: both live inside re-rendered nodes.
  chat.addEventListener('click', event => {
    const copy = event.target.closest('.copy');
    if (copy) {
      const text = copy.closest('.codeblock').querySelector('code').textContent;
      navigator.clipboard?.writeText(text).then(() => {
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
      });
      return;
    }
    const retry = event.target.closest('.regenerate');
    if (retry) regenerate(retry.closest('.message'));
  });
  toBottom.addEventListener('click', pinAndScroll);
  addEventListener('scroll', () => {
    pinned = nearBottom();
    toBottom.hidden = pinned;
  }, {passive: true});
  attach.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    if (imagesAccepted) addImages(imageInput.files).catch(console.error);
    imageInput.value = '';
  });
  input.addEventListener('paste', event => {
    // Without image input the browser pastes as usual.
    if (!imagesAccepted) return;
    const images = Array.from(event.clipboardData?.items || [])
      .filter(item => item.type.startsWith('image/'))
      .map(item => item.getAsFile())
      .filter(Boolean);
    if (!images.length) return;
    if (!event.clipboardData.getData('text/plain')) event.preventDefault();
    addImages(images).catch(console.error);
  });
  input.addEventListener('input', () => { resize(); updateComposer(); });
  input.addEventListener('keydown', event => {
    // Safari can end composition before the confirming Enter keydown.
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); complete(); }
  });
  apiKey.addEventListener('change', loadModalities);
  $('#new-chat').addEventListener('click', newChat);
  $('#mobile-new').addEventListener('click', newChat);
  $('#menu').addEventListener('click', () => document.body.classList.add('menu-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
  renderChat();
  renderRecents();
  updateComposer();
  loadModalities();
</script>
</html>
